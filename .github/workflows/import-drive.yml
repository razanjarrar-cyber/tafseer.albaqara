name: Import from Google Drive
on:
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Public Google Drive folder link'
        required: true
      shards:
        description: 'Parallel jobs'
        default: '12'
permissions:
  contents: write
jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.l.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install gdown
      - id: l
        env: { URL: '${{ inputs.drive_url }}', N: '${{ inputs.shards }}' }
        run: echo "matrix=$(python tools/drive_batch.py list "$URL" "$N")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with: { name: shards, path: shards.json }
  shard:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        k: ${{ fromJson(needs.list.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@v4
        with: { path: ~/.cache/whisper, key: whisper-small }
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -r tools/requirements.txt gdown
      - uses: actions/download-artifact@v4
        with: { name: shards }
      - run: python tools/drive_batch.py shard ${{ matrix.k }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'out-${{ matrix.k }}', path: 'out/${{ matrix.k }}', retention-days: 5 }
  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'out-*', path: results }
      - run: python tools/drive_batch.py merge results
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio data
          git commit -q -m "Import recordings from Google Drive"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
