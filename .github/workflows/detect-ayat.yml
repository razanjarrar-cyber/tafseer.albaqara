name: Detect ayat
on:
  push:
    branches: [main]
    paths: ['audio/inbox/**']
  workflow_dispatch:
concurrency:
  group: detect-ayat
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -r tools/requirements.txt
      - run: python tools/process_inbox.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio data
          git diff --cached --quiet && exit 0
          git commit -m "Detect ayat for new recordings"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
