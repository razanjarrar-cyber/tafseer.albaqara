name: Detect ayat
on:
  push:
    branches: [main]
    paths: ['audio/inbox/**']
  workflow_dispatch:
    inputs:
      drive_url:
        description: 'Google Drive folder or file link to import (optional)'
        required: false
concurrency:
  group: detect-ayat
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-small
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -r tools/requirements.txt gdown
      - name: Import from Google Drive
        if: inputs.drive_url != ''
        env:
          URL: ${{ inputs.drive_url }}
        run: python tools/import_drive.py "$URL"
      - name: Transcribe and match (commits after each file)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/process_inbox.py --commit-each
