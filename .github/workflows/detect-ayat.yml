name: Detect ayat
on:
  push:
    branches: [main]
    paths: ['audio/inbox/**']
  workflow_dispatch:
concurrency:
  group: detect-ayat
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/whisper
          key: whisper-medium
      - run: sudo apt-get install -y ffmpeg >/dev/null
      - run: pip install -r tools/requirements.txt
      - name: Transcribe and match (commits after each file)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/process_inbox.py --commit-each
